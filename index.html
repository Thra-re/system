<style>
:root{

  --muted:#73808a;
  --paper:#ffffff;

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,"Segoe UI",Tahoma,Arial,sans-serif}
button,input{font:inherit}
.app{min-height:100vh}
.header{background:var(--paper);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.header-inner{max-width:1480px;margin:auto;height:82px;padding:0 30px;display:flex;align-items:center;justify-content:space-between;gap:18px}
.brand{display:flex;align-items:center;gap:15px;direction:ltr;text-align:left}
.logo{width:48px;height:48px;border-radius:13px;background:#163546;display:grid;place-items:center;position:relative;box-shadow:0 7px 18px rgba(19,40,58,.13)}

.brand b{display:block;font-size:22px;line-height:1;font-weight:900;letter-spacing:.10em;color:#112b3b}
.brand small{display:block;color:#7b8992;font-size:10px;margin-top:7px;letter-spacing:.17em;font-weight:700}
.actions{display:flex;align-items:center;gap:9px}
.langs{display:flex;border:1px solid var(--line);background:#faf8f3;border-radius:10px;padding:3px}
.langs button{border:0;background:transparent;padding:7px 10px;border-radius:7px;cursor:pointer;color:#6f777d;font-size:11px;font-weight:800}
.langs button.active{background:var(--navy);color:white}
.print{border:1px solid var(--line);background:white;border-radius:9px;padding:9px 12px;cursor:pointer;font-size:10px;font-weight:850;color:var(--navy)}
.main{max-width:1480px;margin:auto;padding:28px 30px 50px}
.intro{display:grid;grid-template-columns:minmax(0,.82fr) minmax(0,1.18fr);gap:18px;margin-bottom:18px;align-items:stretch}
.intro-copy{background:linear-gradient(145deg,#fff 0%,#fbfaf7 100%);color:var(--ink);border:1px solid var(--line);border-radius:20px;padding:20px 22px;position:relative;overflow:hidden;min-height:238px;box-shadow:0 10px 28px rgba(23,33,43,.045);display:flex;flex-direction:column;justify-content:space-between}

.intro-copy:after{content:attr(data-day);position:absolute;right:18px;bottom:-26px;font-size:118px;line-height:1;font-weight:950;color:rgba(19,40,58,.032);letter-spacing:-.08em;pointer-events:none}
.intro-topline{display:flex;align-items:center;justify-content:space-between;gap:16px;position:relative;z-index:1}
.kicker{font-size:8px;letter-spacing:.17em;color:#96723c;text-transform:uppercase;font-weight:900}
.release-badge{display:inline-flex;align-items:center;gap:6px;border:1px solid #ded7ca;background:#f6f2ea;border-radius:999px;padding:5px 8px;font-size:8px;font-weight:850;color:#43525b;white-space:nowrap}
.release-badge:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--red);box-shadow:0 0 0 4px rgba(182,70,60,.09)}

.intro-number{font-size:34px;line-height:1;font-weight:950;color:#d8c6a3;letter-spacing:-.06em;border-right:1px solid #ded8ce;padding-right:12px}
.intro h1{font-size:clamp(25px,2.6vw,37px);line-height:1.08;margin:0 0 8px;max-width:700px;letter-spacing:-.03em;color:#142b3b}
.intro p{max-width:740px;color:#68767e;font-size:10.5px;line-height:1.68;margin:0}
.hero-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;position:relative;z-index:1}
.hero-stat{border-top:1px solid #ded8ce;background:transparent;padding:8px 3px 0}
.hero-stat span{display:block;color:#899399;font-size:7px;text-transform:uppercase;letter-spacing:.07em}
.hero-stat b{display:block;margin-top:3px;font-size:13px;color:#142b3b}
.month-panel{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:17px 18px;box-shadow:0 10px 28px rgba(23,33,43,.045);min-height:238px}
.month-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:8px}
.month-head span{font-size:8px;color:var(--muted);text-transform:uppercase;letter-spacing:.10em}

.weekdays,.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.weekdays div{text-align:center;font-size:7px;color:#98a0a5;padding:3px 0 4px;font-weight:800}
.day{height:34px;border:1px solid #e5e0d7;border-radius:8px;background:#fbfaf7;display:grid;place-items:center;font-size:9px;color:#56616a;position:relative}
.day.empty{border-color:transparent;background:transparent}
.day.release{background:var(--red);color:white;border-color:var(--red);font-weight:900;cursor:pointer;box-shadow:0 8px 18px rgba(182,70,60,.22)}
.day.release:after{content:attr(data-count);position:absolute;right:4px;top:3px;font-size:6px;color:#f7d8d4;background:rgba(255,255,255,.12);border-radius:999px;padding:1px 3px}
.day.release.selected{outline:3px solid rgba(19,40,58,.18);outline-offset:2px;box-shadow:0 8px 20px rgba(182,70,60,.28)}
.month-note{display:flex;align-items:center;gap:7px;margin-top:9px;font-size:8px;color:var(--muted)}
.month-note i{width:8px;height:8px;border-radius:50%;background:var(--red)}
.release-layout{display:grid;grid-template-columns:340px minmax(0,1fr);gap:20px;align-items:start}
.release-index{position:sticky;top:94px;background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 12px 30px rgba(23,33,43,.05)}
.release-index h3{margin:0;font-size:13px}
.release-index p{font-size:9px;color:var(--muted);line-height:1.6;margin:7px 0 14px}
.index-meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.index-meta div{background:#f7f4ee;border-radius:10px;padding:9px}
.index-meta span{display:block;font-size:7px;color:#8a9298;text-transform:uppercase;letter-spacing:.08em}
.index-meta b{display:block;font-size:13px;margin-top:3px}
.filter-list{display:grid;gap:6px}
.filter-btn{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid transparent;background:transparent;border-radius:10px;padding:9px 10px;cursor:pointer;text-align:left;color:#46525b}
.filter-btn:hover{background:#f6f3ee}
.filter-btn.active{background:var(--navy);color:white}
.filter-btn .left{display:flex;align-items:center;gap:8px;font-size:9px;font-weight:800}
.dot{width:8px;height:8px;border-radius:50%;background:var(--sand)}
.filter-btn.active .dot{background:#fff}
.filter-btn small{font-size:8px;opacity:.7}
.searchbox{margin-top:12px;border:1px solid var(--line);border-radius:10px;display:flex;align-items:center;gap:7px;padding:0 10px;background:#fbfaf7}
.searchbox input{width:100%;border:0;background:transparent;outline:0;padding:9px 0;font-size:9px}
.refbox{margin-top:13px;border-top:1px dashed var(--line);padding-top:12px}
.refbox span{display:block;font-size:7px;color:#929a9f;text-transform:uppercase;margin-bottom:5px}
.refbox code{font-size:8px;word-break:break-word;color:#53616a}
.release-sheet{background:var(--paper);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.release-cover{display:grid;grid-template-columns:170px minmax(0,1fr);border-bottom:1px solid var(--line)}
.date-block{background:#f3eee4;padding:24px 22px;display:flex;flex-direction:column;justify-content:space-between;min-height:210px}

.date-block .y{font-size:10px;color:var(--muted);margin-top:3px}
.date-block .stamp{font-size:8px;color:#796f62;letter-spacing:.1em;text-transform:uppercase}
.release-summary{padding:26px 30px}

.release-summary h2{margin:8px 0 10px;font-size:26px}
.release-summary p{margin:0;color:var(--muted);line-height:1.75;font-size:11px;max-width:800px}
.legend{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.legend span{border:1px solid var(--line);border-radius:999px;padding:6px 9px;font-size:8px;color:#56616a;background:#fbfaf7}
.change-stream{padding:6px 30px 30px}
.change{display:grid;grid-template-columns:52px minmax(0,1fr);gap:16px;padding:22px 0;border-bottom:1px solid #ece8e0}
.change:last-child{border-bottom:0}
.change-no{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#f5f1ea;border:1px solid #dfd8cd;color:var(--navy);font-size:11px;font-weight:950;position:relative}
.change-no:after{content:"";position:absolute;top:42px;width:1px;height:30px;background:#e1dbd2}
.change:last-child .change-no:after{display:none}
.change-cat{font-size:8px;color:var(--red);text-transform:uppercase;letter-spacing:.13em;font-weight:900;margin-bottom:5px}
.change h3{margin:0;font-size:16px}
.change ul{margin:10px 0 0;padding:0;display:grid;gap:7px;list-style:none}
.change li{position:relative;padding-left:16px;font-size:10px;line-height:1.65;color:#52606a}
.change li:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--sage);position:absolute;left:0;top:.67em}
.change.hidden{display:none}
.signature-wrap{max-width:1480px;margin:0 auto;padding:0 30px 45px}
.signature{background:linear-gradient(135deg,#13283a,#1d3f56);color:white;border-radius:22px;padding:25px 28px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:24px;box-shadow:0 22px 56px rgba(19,40,58,.22)}

.sig-rule{width:68px;height:2px;background:var(--red);margin:10px 0}
.sig-role{font-size:9px;color:#d3dde2;letter-spacing:.13em;font-weight:800}
.sig-contact{min-width:255px;border-left:1px solid rgba(255,255,255,.12);padding-left:22px;display:grid;gap:9px}
.sig-contact div{display:flex;align-items:center;gap:9px}
.sig-contact i{width:27px;height:27px;border-radius:8px;background:rgba(255,255,255,.07);display:grid;place-items:center;color:#e2c795;font-style:normal}
.sig-contact small{display:block;color:#879ca7;font-size:7px}
.sig-contact b{display:block;font-size:10px;margin-top:2px}
.phone{font-size:12px!important;letter-spacing:.06em}
.footer{text-align:center;color:#8d969b;font-size:8px;letter-spacing:.13em;padding-bottom:26px}
.ar{direction:rtl;text-align:right}
.ar .change li{padding-left:0;padding-right:16px}.ar .change li:before{left:auto;right:0}
.ar .filter-btn{text-align:right}
.ar .intro-copy:before{left:auto;right:0}
.ar .intro-copy:after{right:auto;left:18px}
.ar .intro-number{border-right:0;border-left:1px solid #ded8ce;padding-right:0;padding-left:12px}
.ar .sig-contact{direction:ltr;text-align:left}
.ar .signature{direction:ltr;text-align:left}
@media(max-width:1100px){
  .intro{grid-template-columns:1fr}.intro-copy{order:1}.month-panel{order:2}.release-layout{grid-template-columns:1fr}.release-index{position:static}
}
@media(max-width:720px){
  .header-inner{padding:10px 12px;height:auto;align-items:flex-start}.brand small{display:none}.actions{flex-wrap:wrap;justify-content:flex-end}
  .main{padding:16px 12px 35px}.intro-copy{padding:22px 18px}.intro-main{grid-template-columns:1fr;gap:10px}.intro-number{border-right:0;border-bottom:1px solid #ded8ce;padding:0 0 10px;font-size:32px}.hero-stats{grid-template-columns:1fr 1fr 1fr}.release-cover{grid-template-columns:1fr}.date-block{min-height:auto}
  .date-block .n{font-size:56px}.change-stream{padding:4px 18px 22px}.release-summary{padding:22px 18px}.change{grid-template-columns:40px 1fr;gap:11px}
  .signature-wrap{padding:0 12px 28px}.signature{grid-template-columns:1fr;text-align:center}.seal{margin:auto}.sig-rule{margin:10px auto}.sig-contact{border-left:0;border-top:1px solid rgba(255,255,255,.12);padding:16px 0 0;min-width:0}.sig-contact div{justify-content:center}
}
@media print{.header,.release-index,.month-panel{display:none!important}.main{max-width:none;padding:10px}.intro{display:block}.release-sheet{box-shadow:none}.signature-wrap{padding:10px}}

</style>

      ["finance","Tahsilat Sisteminin Geliştirilmesi",["Tek bir tahsilat işlemi içinde birden fazla ödeme kaydedilebiliyor.","Her ödeme için ayrı ödeme yöntemi seçilebiliyor: Nakit, Banka Havalesi, POS, Çek veya Diğer.","Çekli ödemeler için çek numarası ve vade tarihi gibi özel alanlar eklendi.","Kaydedilmiş tahsilatların sonradan düzenlenebilmesi sağlandı.","Tahsilat düzenlemesi yapılırken değişiklik nedeninin girilmesi zorunlu hâle getirildi.","Değişiklik geçmişi; önceki değer, yeni değer, değişiklik zamanı, işlemi yapan kullanıcı ve değişiklik nedeni ile birlikte kaydediliyor.","Tahsilat tutarının sözleşmenin kalan bakiyesini aşmasını engelleyen kontrol mekanizması eklendi."]],
      ["finance","Hesap Ekstrelerinin Geliştirilmesi",["Hesap ekstresi artık yalnızca müşteri bazında değil, doğrudan satış sözleşmesi veya rezervasyon sözleşmesi bazında takip ediliyor.","Ekstrede sözleşme veya rezervasyon değeri, kapora, tahsilatlar, kalan bakiye, işlem hareketleri ve ilgili ekler gösteriliyor.","Hesap ekstresi Finans sayfasından doğrudan açılabiliyor ve yazdırılabiliyor."]],
      ["contract","Rezervasyon ve Satış Süreçlerinin Geliştirilmesi",["Rezervasyon iptali ve satış iptali işlemleri eklendi.","İptal nedeni, iptal tarihi, işlemi gerçekleştiren kullanıcı ve ilgili ekler kayıt altında tutuluyor.","İptal edilen işlem sistemden silinmiyor; geçmiş kaydı korunuyor.","Rezervasyonun uzatılması veya yenilenmesi için yeni tarih ve uzatma nedeni kaydedilebiliyor.","İnceleme ve denetimi kolaylaştırmak amacıyla işlemin tüm geçmişi korunuyor."]],
      ["contract","İmza Sisteminin Eklenmesi",["Sözleşmenin yazdırılıp fiziksel olarak imzalanması ve imzalı nüshanın sisteme yüklenmesi destekleniyor.","Sistem içinde elektronik imza süreci için ayrı bir akış eklendi.","İmzalar ve imzalı nüshalar ilgili rezervasyon veya satış sözleşmesine bağlanıyor.","Sistem; sunucu aşamasında OTP, e-posta bildirimi ve nihai elektronik imza hizmetleriyle entegre edilebilecek şekilde hazırlandı."]],
      ["finance","Finans Sayfasının Geliştirilmesi",["Satışların ve rezervasyonların finansal durumunu daha açık göstermek için sayfa yeniden düzenlendi.","Temel göstergeler eklendi: Toplam sözleşmeli satışlar, toplam tahsilat, kalan tutarlar, gecikmiş tutarlar, bekleyen çekler, aktif rezervasyon sayısı ve satış sözleşmesi sayısı.","Görsel grafik ve göstergeler eklendi: Rezervasyon ve satış hareketleri, aylık tahsilatlar, ödeme yöntemlerinin dağılımı, daire durumları (müsait / rezerve / satıldı), süresi yaklaşan rezervasyonlar ve gecikmeli ödeme bulunan sözleşmeler."]],
      ["governance","Kapsamlı Sistem Kontrol Panelinin Oluşturulması",["Giriş sonrasında erişilebilen küçük bir Kontrol Paneli simgesi (⚙️) eklendi.","Kontrol paneli; kullanıcı yönetimi, yetkiler, sistem ayarları, iptaller, ekler ve denetim kaydını içeriyor.","Bu alanın sistemin ana idari yönetim merkezi olması hedeflendi."]],
      ["governance","Detaylı Kullanıcı Yetkilendirme Sisteminin Oluşturulması",["Ana hesap, sistemdeki tüm işlevler üzerinde tam yetkiye sahip olacak şekilde yapılandırıldı.","Çok sınırlı ve ayrıntılı yetkilere sahip kullanıcılar oluşturulabiliyor.","Her kullanıcı için her bir yetki ayrı ayrı etkinleştirilebiliyor veya kaldırılabiliyor.","Yetkiler; müşteriler, rezervasyonlar, rezervasyon uzatma, rezervasyon iptali, satışlar, fiyat değişiklikleri, ödeme planları, tahsilatlar, tahsilat düzenleme, çekler, sözleşmeler, ekler, imza, fiyatlandırma, raporlar, ayarlar ve kullanıcı yönetimi gibi alanları kapsıyor."]],
      ["governance","İptaller ve Ekler İçin Özel Merkez",["İptal edilen tüm rezervasyon ve satışların merkezi olarak takip edilebileceği özel bir alan oluşturuldu.","İptal nedeni, tarih, kullanıcı, daire, müşteri ve ilgili ekler birlikte görüntülenebiliyor.","Müşteri dosyaları, sözleşmeler, rezervasyonlar, tahsilatlar ve imzalı nüshaların daha kolay görüntülenmesi için merkezi bir Ekler Merkezi oluşturuldu.","Görsellerin ve PDF dosyalarının daha kolay önizlenmesi destekleniyor."]],
      ["audit","Denetim Kaydı - Audit Trail",["Sistemdeki önemli işlemler kayıt altına alınıyor: tahsilat oluşturma veya düzenleme, iptaller, rezervasyon uzatmaları, kullanıcı ve yetki değişiklikleri, eklerin açılması ve sistem ayarlarındaki değişiklikler.","Amaç, sunucu tabanlı nihai sürüme geçmeden önce kontrol, izlenebilirlik ve şeffaflık seviyesini yükseltmektir."]]
    ]
  },

    releaseTitle:"23 سبتمبر 2026 · تحديثات النظام المعتمدة",

    cats:{crm:"إدارة العملاء",unit:"الوحدات / الواجهة",finance:"المالية",contract:"الحجوزات والعقود",governance:"الإدارة والصلاحيات",audit:"التدقيق"},
    items:[
      ["crm","تطوير إدارة العملاء",["إضافة إمكانية رفع صورة الهوية أو جواز السفر لكل عميل.","إمكانية إضافة عميل جديد مباشرة من شاشة الحجز أو البيع بدون الحاجة للانتقال إلى صفحة العملاء.","العميل الجديد يضاف تلقائيًا إلى قاعدة العملاء ويصبح متاحًا مباشرة داخل المعاملة.","إضافة فحص لمنع تكرار العميل باستخدام رقم الهوية/الجواز أو رقم الجوال."]],
      ["unit","تطوير شاشة تفاصيل الوحدة",["إعادة عرض شكل البرج داخل تفاصيل الوحدة.","إظهار الدور المرتبط بالوحدة المختارة بشكل واضح ومميز.","ربط عرض البرج مع المخطط المعماري للوحدة لتسهيل معرفة موقع الوحدة والدور."]],
      ["finance","تطوير نظام التحصيلات",["إمكانية تسجيل أكثر من دفعة ضمن عملية تحصيل واحدة.","كل دفعة يمكن أن يكون لها طريقة دفع مستقلة مثل: نقدي، تحويل بنكي، POS، شيك أو غيرها.","إضافة بيانات خاصة بالشيكات مثل رقم الشيك وتاريخ الاستحقاق.","إمكانية تعديل التحصيل بعد تسجيله.","إلزام المستخدم بإدخال سبب التعديل.","حفظ سجل كامل للتعديل يوضح القيمة قبل وبعد التعديل، وقت التعديل، المستخدم الذي قام به، وسبب التعديل.","إضافة حماية تمنع تسجيل تحصيل يتجاوز الرصيد المتبقي للعقد."]],
      ["finance","تطوير كشوف الحساب",["أصبح كشف الحساب مرتبطًا بعقد البيع أو اتفاقية الحجز وليس بالعميل فقط.","يعرض قيمة العقد أو الحجز، العربون، التحصيلات، المتبقي، سجل الحركات والمرفقات.","إمكانية فتح وطباعة كشف الحساب مباشرة من صفحة المالية."]],
      ["contract","تطوير الحجوزات والمبيعات",["إضافة إمكانية إلغاء الحجز وإلغاء البيع.","حفظ سبب الإلغاء، تاريخ الإلغاء، المستخدم الذي قام بالإلغاء وأي مرفقات مرتبطة.","الاحتفاظ بالمعاملة الملغاة في السجل وعدم حذفها من النظام.","إضافة إمكانية تمديد أو تجديد الحجز مع تسجيل التاريخ الجديد وسبب التمديد.","المحافظة على تاريخ كامل للمعاملة لتسهيل المراجعة والرقابة."]],
      ["contract","إضافة نظام التوقيع",["دعم التوقيع الورقي من خلال طباعة العقد ثم رفع النسخة الموقعة.","إضافة مسار للتوقيع الإلكتروني داخل النظام.","ربط التوقيعات والنسخ الموقعة بالحجز أو عقد البيع.","تجهيز النظام لربطه لاحقًا بخدمات OTP والبريد الإلكتروني والتوقيع النهائي على السيرفر."]],
      ["finance","تطوير صفحة المالية",["إعادة تنظيم الصفحة لعرض وضع المبيعات والحجوزات بشكل أوضح.","إضافة مؤشرات رئيسية مثل: إجمالي المبيعات المتعاقدة، إجمالي المحصل، المبالغ المتبقية، المبالغ المتأخرة، الشيكات المعلقة، عدد الحجوزات النشطة، وعدد عقود البيع.","إضافة رسوم ومؤشرات بصرية توضح: حركة الحجوزات والمبيعات، التحصيلات الشهرية، توزيع طرق الدفع، حالة الوحدات (متاح، محجوز، مباع)، الحجوزات القريبة من الانتهاء، والعقود التي تحتوي على تأخر في السداد."]],
      ["governance","إنشاء لوحة تحكم شاملة للنظام",["إضافة أيقونة لوحة التحكم ⚙️ بعد تسجيل الدخول.","تشمل إدارة المستخدمين، الصلاحيات، إعدادات النظام، الإلغاءات، المرفقات وسجل التدقيق.","الهدف أن تكون هذه الصفحة هي المركز الإداري الكامل للنظام."]],
      ["governance","إنشاء نظام صلاحيات تفصيلي للمستخدمين",["الحساب الرئيسي لديه صلاحية كاملة على جميع وظائف النظام.","يمكن إنشاء مستخدمين بصلاحيات محددة جدًا.","يمكن تفعيل أو إلغاء كل صلاحية بشكل مستقل لكل مستخدم.","تشمل الصلاحيات: العملاء، الحجوزات، تمديد الحجوزات، إلغاء الحجوزات، المبيعات، تعديل الأسعار، خطط السداد، التحصيلات، تعديل التحصيل، الشيكات، العقود، المرفقات، التوقيع، التسعير، التقارير، الإعدادات والمستخدمين."]],
      ["governance","إضافة مركز خاص بالإلغاءات والمرفقات",["إنشاء مكان مركزي لمتابعة جميع الحجوزات والمبيعات الملغاة.","عرض سبب الإلغاء، التاريخ، المستخدم، الوحدة، العميل والمرفقات.","إنشاء مركز مرفقات لتسهيل استعراض ملفات العملاء والعقود والحجوزات والتحصيلات والنسخ الموقعة.","دعم معاينة الصور وملفات PDF بطريقة أكثر سهولة."]],
      ["audit","إضافة سجل تدقيق Audit Trail",["تسجيل العمليات المهمة داخل النظام مثل: إنشاء أو تعديل التحصيلات، الإلغاءات، تمديد الحجوزات، تعديل المستخدمين والصلاحيات، فتح المرفقات، وتغييرات الإعدادات.","الهدف هو رفع مستوى الرقابة والشفافية قبل الانتقال إلى نسخة السيرفر."]]

        "يتم ربط التوقيع المرسوم أو المرفوع بنفس سجل توقيع العقد، مع تسجيل مصدر التوقيع ضمن بيانات التدقيق."
      ]]
    ]
  }
}
};

let lang="tr",filter="all",q="",selectedDate=Object.keys(RELEASES).sort().reverse()[0];

function e(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function setLang(v){lang=v;document.documentElement.lang=v;document.documentElement.dir=v==="ar"?"rtl":"ltr";document.getElementById("trBtn").classList.toggle("active",v==="tr");document.getElementById("arBtn").classList.toggle("active",v==="ar");render()}
function setFilter(v){filter=v;render()}
function setQ(v){q=(v||"").trim().toLowerCase();render()}
function setReleaseDate(v){if(!RELEASES[v])return;selectedDate=v;filter="all";q="";render()}
function releaseDateParts(){let [y,m,d]=selectedDate.split("-");return{y,m,d,display:`${d}.${m}.${y}`,day:Number(d)}}

function calendarHTML(D){
 const blanks=1;let cells="";
 for(let i=0;i<blanks;i++)cells+=`<div class="day empty"></div>`;
 for(let d=1;d<=30;d++){
   let key=`2026-09-${String(d).padStart(2,"0")}`,rel=RELEASES[key],count=rel?rel[lang].items.length:0,h=rel?rel.hours:0;
   cells+=`<div class="day ${rel?"release":""} ${key===selectedDate?"selected":""}" ${rel?`data-count="${count}" data-hours="${h}h" onclick="setReleaseDate('${key}')" title="${key} · ${h}h"`:""}>${d}</div>`;
 }
 return `<div class="weekdays">${D.week.map(x=>`<div>${e(x)}</div>`).join("")}</div><div class="calendar">${cells}</div>`;
}

function render(){
 const rel=RELEASES[selectedDate],D=rel[lang],date=releaseDateParts(),counts={};D.items.forEach(x=>counts[x[0]]=(counts[x[0]]||0)+1);
 const shown=D.items.map((x,i)=>({x,i})).filter(o=>(filter==="all"||o.x[0]===filter)&&(!q||(o.x[1]+" "+o.x[2].join(" ")).toLowerCase().includes(q)));
 const cats=[["all",D.all],...Object.entries(D.cats).filter(([k])=>counts[k])];
 const dates=Object.keys(RELEASES).sort(),releaseIndex=dates.indexOf(selectedDate)+1;
 const totalMajor=dates.reduce((a,k)=>a+RELEASES[k][lang].items.length,0);

 document.getElementById("root").innerHTML=`<main class="main ${lang==="ar"?"ar":""}">
   <section class="intro">
     <div class="intro-copy" data-day="${date.d}">
       <div class="intro-topline"><div class="kicker">EMRINA · MASAR MAKKAH · ${e(D.record)}</div><div class="release-badge">${date.display}</div></div>
       <div class="intro-main"><div class="intro-number">${String(releaseIndex).padStart(2,"0")}</div><div><h1>${e(D.heroTitle)}</h1><p>${e(D.heroText)}</p></div></div>
       <div class="hero-stats">
         <div class="hero-stat"><span>${e(D.updates)}</span><b>${D.items.length}</b></div>
         <div class="hero-stat"><span>${e(D.areas)}</span><b>${Object.keys(counts).length}</b></div>
         <div class="hero-stat"><span>${e(D.workHours)}</span><b>${rel.hours} ${e(D.hoursUnit)}</b></div>
       </div>
     </div>
     <div class="month-panel">
       <div class="month-head"><div><span>RELEASE CALENDAR</span><b>${e(D.month)}</b></div><span>2026</span></div>
       ${calendarHTML(D)}
       <div class="month-note"><i></i><span>${e(D.legend)}</span></div>
     </div>
   </section>

   <section class="release-layout">
     <aside class="release-index">
       <h3>${e(D.record)}</h3>
       <p>${e(D.releaseText)}</p>
       <div class="index-meta"><div><span>${e(D.updates)}</span><b>${D.items.length}</b></div><div><span>${e(D.areas)}</span><b>${Object.keys(counts).length}</b></div></div>
       <div class="history-summary">
         <div><span>${e(D.workHours)}</span><b>${rel.hours} ${e(D.hoursUnit)}</b></div>
         <div><span>${e(D.projectHours)}</span><b>${REPORT_META.totalHours} ${e(D.hoursUnit)}</b></div>
         <div><span>${e(D.developmentDays)}</span><b>${REPORT_META.developmentDays}</b></div>
       </div>
       <div class="hours-note">${e(D.hoursNote)}</div>
       <div class="filter-list" style="margin-top:12px">${cats.map(([k,v])=>`<button class="filter-btn ${filter===k?"active":""}" onclick="setFilter('${k}')"><span class="left"><i class="dot"></i>${e(v)}</span><small>${k==="all"?D.items.length:(counts[k]||0)}</small></button>`).join("")}</div>
       <div class="searchbox"><span>⌕</span><input value="${e(q)}" oninput="setQ(this.value)" placeholder="${e(D.search)}"></div>
       <div class="refbox"><span>${e(D.reference)}</span><code dir="ltr">${e(REPORT_META.reference)}</code></div>
     </aside>

     <article class="release-sheet">
       <header class="release-cover">
         <div class="date-block"><div><div class="n">${date.d}</div><div class="m">${lang==="ar"?"سبتمبر":"EYLÜL"}</div><div class="y">${date.y}</div></div><div class="stamp">${e(D.record)} · ${rel.hours}h</div></div>
         <div class="release-summary"><div class="eyebrow">RELEASE ${String(releaseIndex).padStart(2,"0")} · ${date.display}</div><h2>${e(D.releaseTitle)}</h2><p>${e(D.releaseText)}</p><div class="legend">${Object.entries(D.cats).filter(([k])=>counts[k]).map(([k,v])=>`<span>${e(v)} · ${counts[k]}</span>`).join("")}<span class="hours-chip"><i></i>${e(D.workHours)} · ${rel.hours} ${e(D.hoursUnit)}</span></div></div>
       </header>
       <div class="change-stream">${shown.map(o=>`<section class="change"><div class="change-no">${String(o.i+1).padStart(2,"0")}</div><div><div class="change-cat">${e(D.cats[o.x[0]])}</div><h3>${e(o.x[1])}</h3><ul>${o.x[2].map(b=>`<li>${e(b)}</li>`).join("")}</ul></div></section>`).join("")}</div>
     </article>
   </section>
 </main>`;
}
render();
</script>
</body>
</html>
